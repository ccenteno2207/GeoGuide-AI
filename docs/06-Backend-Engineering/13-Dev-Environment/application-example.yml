spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

geoguide:
  routing:
    base-url: ${ROUTING_BASE_URL}
    timeout-seconds: ${ROUTING_TIMEOUT_SECONDS:10}
