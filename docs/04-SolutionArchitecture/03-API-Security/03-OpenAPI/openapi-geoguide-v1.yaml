openapi: 3.1.0
info:
  title: GeoGuide AI API
  version: 1.0.0
  description: API inicial para rutas y descubrimiento de puntos de interés.
servers:
  - url: https://api.example.org/api/v1
paths:
  /places/{id}:
    get:
      summary: Obtener detalle de un punto de interés
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Punto de interés encontrado
        '404':
          description: Punto de interés no encontrado
  /places/nearby:
    get:
      summary: Buscar puntos de interés cercanos
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: lon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 100, maximum: 50000, default: 5000 }
      responses:
        '200':
          description: Lista de puntos cercanos
  /routes/plan:
    post:
      summary: Calcular una ruta entre origen y destino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlanRequest'
      responses:
        '200':
          description: Ruta calculada
  /routes/discover:
    post:
      summary: Descubrir POIs dentro de un corredor alrededor de una ruta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteDiscoveryRequest'
      responses:
        '200':
          description: POIs relevantes encontrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDiscoveryResponse' }
        '400': { description: Request discovery inválido }
        '404': { description: Ruta no encontrada }
        '500': { description: Error interno de discovery }
        '502': { description: Error del proveedor de rutas }
        '503': { description: Proveedor de rutas no disponible }
        '504': { description: Timeout del proveedor de rutas }
components:
  schemas:
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    RoutePlanRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
    RouteDiscoveryRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        corridorMeters:
          type: integer
          minimum: 1000
          maximum: 10000
          default: 5000
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        categories:
          type: array
          items: { type: string }
    RouteDiscoveryResponse:
      type: object
      required: [route, results, algorithmVersion, generatedAt]
      properties:
        route: { type: object }
        results:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, name, category, location, distanceToRouteMeters, routeProgress, score, reasonCodes]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              location: { $ref: '#/components/schemas/GeoPoint' }
              distanceToRouteMeters: { type: number, minimum: 0 }
              routeProgress: { type: number, minimum: 0, maximum: 1 }
              score: { type: number, minimum: 0 }
              reasonCodes: { type: array, items: { type: string, enum: [NEAR_ROUTE, CATEGORY_MATCH] } }
        algorithmVersion: { type: string, enum: [DISCOVERY_V1] }
        generatedAt: { type: string, format: date-time }
