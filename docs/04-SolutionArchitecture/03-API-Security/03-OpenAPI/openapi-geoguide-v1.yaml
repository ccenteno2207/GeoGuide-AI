openapi: 3.1.0
info:
  title: GeoGuide AI API
  version: 1.0.0
  description: API inicial para rutas y descubrimiento de puntos de interés.
servers:
  - url: https://api.example.org/api/v1
paths:
  /destinations/search:
    post:
      summary: Buscar destinos del catálogo curado por nombre
      description: La consulta se envía explícitamente. No se conserva historial de búsqueda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DestinationSearchRequest' }
      responses:
        '200':
          description: Coincidencias verificadas; lista vacía cuando no hay resultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestinationSearchResponse' }
        '400': { description: Consulta o límite inválido }
        '500': { description: Error interno }
  /admin/imports:
    get:
      summary: Consultar lotes de importación MINCETUR
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lotes con recuentos de candidatos y cuarentena
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminImportBatch' } }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol administrativo requerido }
  /admin/imports/{batchId}/records:
    get:
      summary: Consultar registros raw y candidatos normalizados de un snapshot
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: locality
          required: false
          description: Coincidencia por distrito, provincia o región del snapshot; solo lectura.
          schema: { type: string }
        - in: query
          name: category
          required: false
          description: Igualdad exacta con CATEGORÍA raw de MINCETUR.
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Registros de staging; la respuesta no publica coordenadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminImportRecordPage' }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol administrativo requerido }
  /admin/records:
    get:
      summary: Listar candidatos editoriales
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, ARCHIVED] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: locality
          description: Coincidencia sobre contexto administrativo del borrador.
          schema: { type: string }
        - in: query
          name: category
          description: Código de categoría exacto.
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Lista de candidatos editoriales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEditorialPage' }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol administrativo requerido }
    post:
      summary: Crear un candidato curado o derivado de una fila importada elegible
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEditorialCreate' }
      responses:
        '201': { description: Candidato DRAFT; no altera el catálogo público }
        '400': { description: Fila en cuarentena o datos inválidos }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol editor o administrador requerido }
  /admin/records/{id}:
    get:
      summary: Consultar detalle editorial y trazabilidad
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del candidato editorial
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEditorialRecord' }
        '404': { description: Candidato no encontrado }
    put:
      summary: Editar un borrador editorial con control de versión
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEditorialUpdate' }
      responses:
        '200': { description: Candidato actualizado y revisiones geográfica/identidad reiniciadas }
        '409': { description: Versión obsoleta o candidato no editable }
  /admin/records/{id}/duplicates:
    get:
      summary: Buscar coincidencias por identidad o proximidad; nunca fusiona automáticamente
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Coincidencias con POIs o destinos actuales }
  /admin/records/{id}/geographic-review:
    post:
      summary: Registrar aprobación geográfica explícita con motivo
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGeographicDecision' }
      responses:
        '200': { description: Estado geográfico actualizado; no publica el POI }
        '403': { description: Revisor o administrador requerido }
  /admin/records/{id}/identity-review:
    post:
      summary: Resolver explícitamente revisión de identidad/duplicados
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminIdentityDecision' }
      responses:
        '200': { description: Revisión de identidad registrada }
        '403': { description: Revisor o administrador requerido }
  /admin/records/{id}/submit:
    post:
      summary: Enviar candidato a revisión editorial
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVersionedAction' }
      responses:
        '200': { description: Candidato PENDING_REVIEW }
  /admin/records/{id}/approve:
    post:
      summary: Aprobar editorialmente un candidato sin activarlo
      description: Requiere revisiones geográfica e identidad y provenance. Crea un POI desactivado o aplica una solicitud aprobada al UUID existente manteniéndolo desactivado.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVersionedAction' }
      responses:
        '200': { description: POI aprobado y desactivado; aún no visible en Rutea }
        '409': { description: Faltan controles previos o la versión cambió }
  /admin/records/{id}/observe:
    post:
      summary: Devolver un candidato a estado OBSERVED con evidencia
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersionedAction' } } }
      responses:
        '200': { description: Candidato observado y no publicado }
        '403': { description: Rol revisor o administrador requerido }
  /admin/records/{id}/suspend:
    post:
      summary: Suspender un POI aprobado; se desactiva para Rutea
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersionedAction' } } }
      responses:
        '200': { description: POI suspendido y desactivado }
        '403': { description: ADMINISTRATOR requerido }
  /admin/records/{id}/restore-approval:
    post:
      summary: Restaurar aprobación de un POI suspendido, todavía inactivo
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersionedAction' } } }
      responses:
        '200': { description: Aprobación restaurada; activación requiere acción administrativa separada }
        '403': { description: ADMINISTRATOR requerido }
  /admin/records/{id}/reopen:
    post:
      summary: Reabrir expediente ARCHIVED como DRAFT, manteniéndolo desactivado
      description: Solo ADMINISTRATOR. Conserva el ID y provenance, reinicia revisiones y no aprueba ni activa. Requiere motivo y versión actual; si hubo publicación previa, conserva el vínculo como solicitud de cambio al mismo POI.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminReopenRequest' } } }
      responses:
        '200': { description: Expediente DRAFT, inactivo, con revisiones pendientes y auditoría de reapertura }
        '403': { description: ADMINISTRATOR requerido }
        '409': { description: Estado distinto de ARCHIVED, versión obsoleta o vínculo duplicado/conflictivo }
  /admin/records/{id}/activation:
    post:
      summary: Activar o desactivar un POI editorial aprobado
      description: Solo ADMINISTRATOR. Requiere razón, evidencia, controles editoriales y elegibilidad temática vigente.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminActivationRequest' } } }
      responses:
        '200': { description: Estado de visibilidad actualizado y auditado }
        '403': { description: ADMINISTRATOR requerido }
        '409': { description: Registro no aprobado, inelegible o versión obsoleta }
  /admin/records/change-requests/{poiId}:
    post:
      summary: Crear un borrador de cambio para un POI curado existente
      description: Conserva UUID y provenance. La aprobación aplica los cambios con active=false y requiere una activación posterior.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: poiId, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: DRAFT asociado al POI; no altera su visibilidad }
        '409': { description: POI inactivo o con solicitud de cambio existente }
  /admin/pois:
    get:
      summary: Listar POIs existentes con provenance y estado de activación
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: active, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Inventario administrativo paginado }
        '401': { description: Token OIDC requerido }
  /admin/pois/{id}/activation:
    post:
      summary: Activar o desactivar un POI preexistente
      description: Solo ADMINISTRATOR. Rechaza categorías inactivas y recursos MINCETUR excluidos; cada acción se audita.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminExistingPoiActivationRequest' } } }
      responses:
        '200': { description: Estado actualizado }
        '403': { description: ADMINISTRATOR requerido }
        '409': { description: Datos obsoletos o reglas de elegibilidad incumplidas }
  /admin/pois/{id}/activation-history:
    get:
      summary: Consultar historial de activación del POI
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Historial append-only }
  /admin/records/{id}/reject:
    post:
      summary: Rechazar candidato editorial
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVersionedAction' }
      responses:
        '200': { description: Candidato REJECTED }
  /admin/records/{id}/archive:
    post:
      summary: Archivar candidato; desactiva solo el POI creado por su publicación explícita
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminVersionedAction' }
      responses:
        '200': { description: Candidato ARCHIVED }
  /admin/destination-records:
    get:
      summary: Listar candidatos editoriales de destino
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Borradores de destino; no implica elegibilidad pública
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminDestinationPage' } } }
    post:
      summary: Crear candidato sintético/curado de destino
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminDestinationCreate' } } }
      responses:
        '201': { description: Borrador DRAFT privado }
  /admin/destination-records/from-import:
    post:
      summary: Crear borrador independiente desde fila staging elegible
      description: No admite cuarentena, no publica y no reutiliza automáticamente la categoría POI.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminDestinationImportCreate' } } }
      responses:
        '201': { description: Candidato privado de destino }
        '409': { description: Fila no elegible o ya vinculada a un borrador de destino }
  /admin/destination-records/{id}:
    get:
      summary: Consultar candidato de destino y evidencia
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Candidato administrativo }
        '404': { description: Candidato no encontrado }
    put:
      summary: Editar candidato y reiniciar revisiones independientes
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminDestinationUpdate' } } }
      responses:
        '200': { description: Candidato actualizado }
        '409': { description: Versión obsoleta o no editable }
  /admin/destination-records/{id}/duplicates:
    get:
      summary: Obtener indicios de duplicado; no fusiona ni aprueba identidad
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Destinos y POIs candidatos de comparación } }
  /admin/destination-records/{id}/geographic-review:
    post:
      summary: Aprobar o rechazar coordenada con actor, razón y evidencia
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminGeographicDecision' } } }
      responses: { '200': { description: Revisión geográfica registrada }, '409': { description: Coordenada/evidencia insuficiente o versión obsoleta } }
  /admin/destination-records/{id}/identity-review:
    post:
      summary: Registrar decisión independiente de identidad
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminIdentityDecision' } } }
      responses: { '200': { description: Revisión de identidad registrada } }
  /admin/destination-records/{id}/access-review:
    post:
      summary: Revisar separadamente el punto de llegada/acceso vial
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccessDecision' } } }
      responses: { '200': { description: Revisión de acceso registrada }, '409': { description: Revisión geográfica previa requerida } }
  /admin/destination-records/{id}/{action}:
    post:
      summary: Enviar, publicar, rechazar o archivar destino
      description: approve solo publica tras revisión geográfica, identidad sin duplicado, acceso aprobado y provenance/licencia. No crea ni actualiza POI.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [submit, approve, reject, archive] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminVersionedAction' } } }
      responses: { '200': { description: Transición editorial explícita }, '409': { description: Controles incompletos o versión obsoleta } }
  /admin/destination-poi-relationships:
    get:
      summary: Listar relaciones explícitas destino-POI
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Relaciones y datos de ambas entidades sin sincronización } }
    post:
      summary: Crear relación PENDING con evidencia auditable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminDestinationPoiRelationshipCreate' } } }
      responses: { '201': { description: Relación pendiente; no cambia publicación o geometría } }
  /admin/destination-poi-relationships/{id}/{action}:
    post:
      summary: Aprobar o rechazar relación existente
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [approve, reject] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRelationshipReview' } } }
      responses: { '200': { description: Decisión de relación auditada }, '409': { description: Versión obsoleta o relación no pendiente } }
  /admin/pois/{poiId}/content:
    get:
      summary: Consultar contenido turístico, borrador y datos curados del POI
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Contenido administrativo y fuente curada, con Cache-Control no-store
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoiContentResponse' } } }
        '404': { description: POI inexistente }
  /admin/pois/{poiId}/content/draft:
    put:
      summary: Guardar una nueva revisión de borrador turístico
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoiContentDraft' } } }
      responses: { '200': { description: Borrador versionado y auditado }, '409': { description: Versión obsoleta o revisión pendiente } }
  /admin/pois/{poiId}/content/submit:
    post:
      summary: Enviar contenido turístico a revisión
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoiContentAction' } } }
      responses: { '200': { description: Borrador pendiente de revisión }, '400': { description: Descripción requerida; no se permite contenido provisional }, '409': { description: Versión o transición inválida } }
  /admin/pois/{poiId}/content/publish:
    post:
      summary: Publicar contenido turístico aprobado sin cambiar activación del POI
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoiContentAction' } } }
      responses: { '200': { description: Contenido publicado y POI sin cambio de activación }, '400': { description: Descripción requerida; no se permite contenido provisional }, '409': { description: Versión o transición inválida } }
  /admin/pois/{poiId}/content/revert:
    post:
      summary: Copiar una revisión previa a un nuevo borrador
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminPoiContentRevert' } } }
      responses: { '200': { description: Borrador nuevo; no se publica automáticamente }, '409': { description: Versión obsoleta } }
  /pois/{poiId}/content:
    get:
      summary: Consultar contenido publicado o descripción curada de fallback
      parameters: [{ in: path, name: poiId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Contenido en línea; drafts nunca expuestos; Cache-Control no-store
          content: { application/json: { schema: { $ref: '#/components/schemas/PoiTourismContentResponse' } } }
        '404': { description: POI inexistente o inactivo }
  /admin/pois/{poiId}/media:
    get:
      summary: Listar media privada de un POI
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Metadatos internos de assets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminMediaAsset' } }
    post:
      summary: Subir una imagen JPEG/PNG privada como borrador
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, author, sourceUrl]
              properties:
                file: { type: string, format: binary, description: JPEG or PNG image; maximum 10 MiB }
                author: { type: string, maxLength: 200, description: Author or rights holder }
                sourceUrl: { type: string, format: uri, maxLength: 2048, description: HTTPS source URL }
                altText: { type: string, maxLength: 500, description: Optional on private draft upload; required before publication }
      responses:
        '200':
          description: Asset validado por contenido, re-encoded, hashed y no publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMediaAsset' }
        '400':
          description: Invalid upload fields or unsupported/undecodable image; includes field-level errors
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AdminValidationProblem' }
        '401': { description: Sesión no válida }
        '403': { description: Rol sin autorización para cargar imágenes }
        '413':
          description: Se superó el límite de tamaño configurado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AdminValidationProblem' }
  /admin/media/{id}/history:
    get:
      summary: Consultar auditoría de un asset multimedia
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Historial auditado del asset; Cache-Control no-store } }
  /admin/media/{id}/rights:
    patch:
      summary: Registrar licencia, atribución y evidencia documental de derechos
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMediaRights' }
      responses:
        '200': { description: Metadatos de derechos guardados en borrador }
        '409': { description: Versión obsoleta o asset no editable }
  /admin/media/{id}/submit:
    post:
      summary: Enviar media privada para revisión
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMediaVersionedAction' }
      responses: { '200': { description: Asset PENDING_REVIEW } }
  /admin/media/{id}/publish:
    post:
      summary: Publicar imagen con derechos documentados y decisión de revisor
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMediaPublish' }
      responses: { '200': { description: Asset publicado; puede convertirse en imagen principal } }
  /admin/media/{id}/withdraw:
    post:
      summary: Retirar imagen publicada
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMediaVersionedAction' }
      responses: { '200': { description: Asset retirado y sin imagen principal } }
  /admin/media/{id}/reject:
    post:
      summary: Rechazar media pendiente de revisión
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMediaVersionedAction' }
      responses: { '200': { description: Asset rechazado sin publicarse } }
  /pois/{poiId}/media/primary:
    get:
      summary: Obtener la imagen principal si el POI y el asset están publicados
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bytes JPEG/PNG servidos desde almacenamiento privado con Cache-Control no-store
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { description: No existe media publicada para el POI }
  /pois/{poiId}/operational-info:
    get:
      summary: Consultar horarios y actividades vigentes de un POI activo
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Datos operativos actuales; no se incluyen en snapshots offline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiOperationalInfo' }
        '404': { description: POI inexistente o inactivo }
  /admin/pois/{poiId}/operational-info:
    get:
      summary: Leer horarios y actividades para edición administrativa
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Información operativa y versión vigente, incluso si el POI está desactivado }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol administrativo requerido }
        '404': { description: POI inexistente }
    put:
      summary: Actualizar información operativa sin transición editorial ni desactivación
      description: Requiere rol ADMINISTRATOR o EDITOR; registra actor, versión y auditoría, pero no exige aprobación geográfica, de identidad ni editorial.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poiId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoiOperationalInfoUpdate' }
      responses:
        '200': { description: Información guardada; la activación editorial del POI no cambia }
        '400': { description: Horario o actividad inválida }
        '401': { description: Token OIDC requerido }
        '403': { description: Rol editor o administrador requerido }
        '404': { description: POI inexistente }
        '409': { description: Versión obsoleta; recargue la información }
  /places/{id}:
    get:
      summary: Obtener detalle de un punto de interés
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Punto de interés encontrado
        '404':
          description: Punto de interés no encontrado
  /places/nearby:
    get:
      summary: Buscar puntos de interés cercanos
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: lon
          required: true
          schema: { type: number, format: double }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 100, maximum: 50000, default: 5000 }
      responses:
        '200':
          description: Lista de puntos cercanos
  /routes/plan:
    post:
      summary: Calcular una ruta entre origen y destino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlanRequest'
      responses:
        '200':
          description: Ruta calculada
  /routes/discover:
    post:
      summary: Descubrir POIs dentro de un corredor alrededor de una ruta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteDiscoveryRequest'
      responses:
        '200':
          description: POIs relevantes encontrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDiscoveryResponse' }
        '400': { description: Request discovery inválido }
        '404': { description: Ruta no encontrada }
        '500': { description: Error interno de discovery }
        '502': { description: Error del proveedor de rutas }
        '503': { description: Proveedor de rutas no disponible }
        '504': { description: Timeout del proveedor de rutas }
components:
  schemas:
    PoiOperationalInfo:
      type: object
      required: [timeZone, weeklyHours, items, version]
      properties:
        timeZone: { type: string, example: America/Lima }
        weeklyHours:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/PoiDailyHours' }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PoiOperationalItem' }
        version: { type: integer, format: int64, minimum: 0 }
    PoiDailyHours:
      type: object
      required: [day, periods]
      properties:
        day: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        periods:
          type: array
          items: { $ref: '#/components/schemas/PoiTimeRange' }
    PoiTimeRange:
      type: object
      required: [opensAt, closesAt]
      properties:
        opensAt: { type: string, format: time }
        closesAt: { type: string, format: time }
    PoiOperationalItem:
      type: object
      required: [id, type, title, active]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [PERFORMANCE, PROMOTION] }
        title: { type: string, maxLength: 200 }
        description: { type: string, nullable: true, maxLength: 2000 }
        scheduleText: { type: string, nullable: true, maxLength: 500 }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        terms: { type: string, nullable: true, maxLength: 1000 }
        active: { type: boolean }
    PoiOperationalInfoUpdate:
      type: object
      required: [expectedVersion, timeZone, weeklyHours, items]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        timeZone: { type: string, example: America/Lima }
        weeklyHours:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/PoiDailyHours' }
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PoiOperationalItem' }
    DestinationSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 100 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 10 }
    DestinationSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DestinationSearchResult' }
    DestinationSearchResult:
      type: object
      required: [id, name, type, administrativeContext, latitude, longitude, source, sourceUrl, license, attribution]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        administrativeContext: { type: string }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        source: { type: string }
        sourceUrl: { type: string, format: uri }
        license: { type: string }
        attribution: { type: string }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    RoutePlanRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
    RouteDiscoveryRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/GeoPoint' }
        destination: { $ref: '#/components/schemas/GeoPoint' }
        corridorMeters:
          type: integer
          minimum: 1000
          maximum: 10000
          default: 5000
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        categories:
          type: array
          items: { type: string }
    RouteDiscoveryResponse:
      type: object
      required: [route, results, algorithmVersion, generatedAt]
      properties:
        route: { type: object }
        results:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, name, category, location, distanceToRouteMeters, routeProgress, score, reasonCodes]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              location: { $ref: '#/components/schemas/GeoPoint' }
              distanceToRouteMeters: { type: number, minimum: 0 }
              routeProgress: { type: number, minimum: 0, maximum: 1 }
              score: { type: number, minimum: 0 }
              reasonCodes: { type: array, items: { type: string, enum: [NEAR_ROUTE, CATEGORY_MATCH] } }
              primaryMediaPath: { type: string, nullable: true, description: API-relative path for the published primary image; absent while no licensed image is published }
        algorithmVersion: { type: string, enum: [DISCOVERY_V1] }
        generatedAt: { type: string, format: date-time }
    AdminImportBatch:
      type: object
      required: [id, fileName, sha256, total, candidates, quarantined, poiDrafts, destinationDrafts, unassignedCandidates]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        sha256: { type: string }
        cutoff: { type: string, format: date, nullable: true }
        total: { type: integer }
        candidates: { type: integer }
        quarantined: { type: integer }
        poiDrafts: { type: integer, description: Cantidad de borradores POI vinculados al lote; no implica publicación }
        destinationDrafts: { type: integer, description: Cantidad de borradores destino vinculados al lote; no implica publicación }
        unassignedCandidates: { type: integer, description: Candidatos pendientes sin borrador POI ni destino }
    AdminImportRecord:
      type: object
      required: [id, rowNumber, status, hasEditorialRecord, hasDestinationEditorialRecord, reviewClassification]
      properties:
        id: { type: string, format: uuid }
        sourceRecordId: { type: string, nullable: true }
        rowNumber: { type: integer }
        name: { type: string, nullable: true }
        sourceCategory: { type: string, nullable: true }
        sourceType: { type: string, nullable: true, description: Valor raw MINCETUR de TIPO DE CATEGORÍA; no se reescribe }
        suggestedPoiCategoryCode: { type: string, nullable: true, description: Mapeo exacto conocido a una categoría P3; null requiere selección editorial explícita }
        region: { type: string, nullable: true }
        province: { type: string, nullable: true }
        district: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        rawLatitude: { type: string, nullable: true }
        rawLongitude: { type: string, nullable: true }
        normalizedLatitude: { type: number, nullable: true }
        normalizedLongitude: { type: number, nullable: true }
        normalizationRule: { type: string, nullable: true }
        validationEvidence: { type: string, nullable: true }
        status: { type: string }
        quarantineReason: { type: string, nullable: true }
        hasEditorialRecord: { type: boolean }
        hasDestinationEditorialRecord: { type: boolean }
        reviewClassification: { type: string, enum: [QUARANTINED, POI_AND_DESTINATION_EDITORIALS_EXIST, POI_EDITORIAL_EXISTS, DESTINATION_EDITORIAL_EXISTS, UNASSIGNED_CANDIDATE] }
    AdminImportRecordPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminImportRecord' } }
    AdminEditorialPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminEditorialRecord' } }
    AdminDestinationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/AdminDestinationRecord' } }
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    AdminEditorialRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        importRecordId: { type: string, format: uuid, nullable: true }
        sourceRecordId: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        administrativeContext: { type: string, nullable: true }
        categoryCode: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        rawLatitude: { type: string, nullable: true }
        rawLongitude: { type: string, nullable: true }
        normalizationRule: { type: string, nullable: true }
        coordinateEvidence: { type: string, nullable: true }
        geographicReviewStatus: { type: string }
        identityReviewStatus: { type: string }
        identityReviewEvidence: { type: string, nullable: true }
        state: { type: string }
        sourceLicense: { type: string, nullable: true, maxLength: 240 }
        sourceAttribution: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        publishedPoiId: { type: string, format: uuid, nullable: true }
        active: { type: boolean, description: Requiere APPROVED y activación administrativa }
        targetPoiId: { type: string, format: uuid, nullable: true, description: UUID existente asociado a un borrador de cambio }
        version: { type: integer, format: int64 }
    AdminEditorialCreate:
      type: object
      required: [categoryCode]
      properties:
        importRecordId: { type: string, format: uuid, nullable: true }
        name: { type: string, nullable: true, description: Requerido cuando importRecordId es null; en filas importadas se obtiene de los datos raw }
        description: { type: string, nullable: true }
        administrativeContext: { type: string, nullable: true, description: Contexto ingresado por editor; no determina coordenadas ni ubicación validada }
        categoryCode: { type: string, enum: [WATERFALL, LAGOON, MOUNTAIN, FOREST, BEACH, MUSEUM, ARCHAEOLOGICAL_SITE, MONUMENT, HISTORIC_CHURCH, VIEWPOINT, FUEL, HEALTH, FOOD, LODGING, OTHER] }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        rawLatitude: { type: string, nullable: true }
        rawLongitude: { type: string, nullable: true }
        normalizationRule: { type: string, nullable: true }
        coordinateEvidence: { type: string, nullable: true }
        sourceLicense: { type: string, nullable: true, maxLength: 240 }
        sourceAttribution: { type: string, nullable: true }
    AdminEditorialUpdate:
      type: object
      required: [expectedVersion, reason, name, categoryCode]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        administrativeContext: { type: string, nullable: true, description: Contexto administrativo; editarlo reinicia las revisiones según el flujo vigente }
        categoryCode: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        normalizationRule: { type: string, nullable: true }
        coordinateEvidence: { type: string, nullable: true }
        sourceLicense: { type: string, nullable: true, maxLength: 240 }
        sourceAttribution: { type: string, nullable: true }
    AdminVersionedAction:
      type: object
      required: [expectedVersion, reason, evidence]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string }
        evidence: { type: string, description: Referencia o evidencia concreta que respalda esta decisión }
    AdminReopenRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AdminActivationRequest:
      type: object
      required: [expectedVersion, active, reason, evidence]
      properties:
        expectedVersion: { type: integer, format: int64 }
        active: { type: boolean }
        reason: { type: string }
        evidence: { type: string }
    AdminExistingPoiActivationRequest:
      type: object
      required: [expectedUpdatedAt, active, reason, evidence]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        active: { type: boolean }
        reason: { type: string }
        evidence: { type: string }
    AdminDestinationRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        importRecordId: { type: string, format: uuid, nullable: true }
        sourceRecordId: { type: string, nullable: true }
        canonicalName: { type: string }
        destinationType: { type: string }
        administrativeContext: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        rawLatitude: { type: string, nullable: true }
        rawLongitude: { type: string, nullable: true }
        normalizationRule: { type: string, nullable: true }
        coordinateEvidence: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        sourceLicense: { type: string, nullable: true }
        sourceAttribution: { type: string, nullable: true }
        geographicReviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        identityReviewStatus: { type: string, enum: [PENDING, NO_DUPLICATE, MATCH_FOUND] }
        identityReviewEvidence: { type: string, nullable: true }
        accessReviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        accessReviewEvidence: { type: string, nullable: true }
        state: { type: string, enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, ARCHIVED] }
        publishedDestinationId: { type: string, format: uuid, nullable: true }
        version: { type: integer, format: int64 }
    AdminDestinationCreate:
      type: object
      required: [canonicalName, destinationType, administrativeContext, sourceUrl, sourceLicense, sourceAttribution]
      properties:
        canonicalName: { type: string }
        destinationType: { type: string }
        administrativeContext: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        rawLatitude: { type: string, nullable: true }
        rawLongitude: { type: string, nullable: true }
        normalizationRule: { type: string, nullable: true }
        coordinateEvidence: { type: string, nullable: true }
        sourceUrl: { type: string }
        sourceLicense: { type: string }
        sourceAttribution: { type: string }
        sourceRecordId: { type: string, nullable: true }
    AdminDestinationImportCreate:
      type: object
      required: [importRecordId, destinationType]
      properties:
        importRecordId: { type: string, format: uuid }
        destinationType: { type: string }
        sourceLicense: { type: string, nullable: true }
        sourceAttribution: { type: string, nullable: true }
    AdminDestinationUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminDestinationCreate'
        - type: object
          required: [expectedVersion, reason]
          properties:
            expectedVersion: { type: integer, format: int64 }
            reason: { type: string }
    AdminAccessDecision:
      type: object
      required: [expectedVersion, approve, reason, evidence]
      properties:
        expectedVersion: { type: integer, format: int64 }
        approve: { type: boolean }
        reason: { type: string }
        evidence: { type: string }
    AdminDestinationPoiRelationshipCreate:
      type: object
      required: [destinationId, poiId, relationshipType, reason, evidence]
      properties:
        destinationId: { type: string, format: uuid }
        poiId: { type: string, format: uuid }
        relationshipType: { type: string, enum: [SAME_RESOURCE, RELATED_RESOURCE] }
        reason: { type: string }
        evidence: { type: string }
    AdminRelationshipReview:
      type: object
      required: [expectedVersion, reason, evidence]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string }
        evidence: { type: string }
    AdminMediaRights:
      allOf:
        - $ref: '#/components/schemas/AdminMediaVersionedAction'
        - type: object
          required: [license, attribution, evidenceReference]
          properties:
            license: { type: string }
            attribution: { type: string }
            evidenceReference: { type: string }
    AdminPoiContent:
      type: object
      required: [summary, description, history, significance, visitorExperience, interestingFacts, recommendations, practicalInfo, officialUrl]
      properties:
        summary: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 12000 }
        history: { type: string, maxLength: 12000 }
        significance: { type: string, maxLength: 8000 }
        visitorExperience: { type: string, maxLength: 8000 }
        interestingFacts: { type: array, maxItems: 20, items: { type: string, maxLength: 1000 } }
        recommendations: { type: array, maxItems: 20, items: { type: string, maxLength: 1000 } }
        practicalInfo: { type: string, maxLength: 6000 }
        officialUrl: { type: string, format: uri, maxLength: 2000 }
    AdminPoiContentDraft:
      type: object
      required: [expectedVersion, content, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        content: { $ref: '#/components/schemas/AdminPoiContent' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AdminPoiContentAction:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AdminPoiContentRevert:
      allOf:
        - $ref: '#/components/schemas/AdminPoiContentAction'
        - type: object
          required: [revisionId]
          properties:
            revisionId: { type: string, format: uuid }
    PoiTourismContentResponse:
      type: object
      required: [poiId, contentSource, content, photos]
      properties:
        poiId: { type: string, format: uuid }
        publishedVersion: { type: integer, format: int64, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        contentSource: { type: string, enum: [PUBLISHED, CURATED] }
        content: { $ref: '#/components/schemas/AdminPoiContent' }
        photos: { type: array, items: { $ref: '#/components/schemas/PublicPoiPhoto' } }
    AdminPoiContentResponse:
      type: object
      required: [poiId, curatedPoi, draftVersion, draftState, draftContent, publishedContent, revisions]
      properties:
        poiId: { type: string, format: uuid }
        curatedPoi: { $ref: '#/components/schemas/CuratedPoiSummary' }
        draftVersion: { type: integer, format: int64 }
        draftState: { type: string, enum: [NONE, DRAFT, PENDING_REVIEW, PUBLISHED, SUPERSEDED] }
        draftContent: { $ref: '#/components/schemas/AdminPoiContent' }
        publishedVersion: { type: integer, format: int64, nullable: true }
        publishedContent: { $ref: '#/components/schemas/AdminPoiContent' }
        publishedAt: { type: string, format: date-time, nullable: true }
        revisions: { type: array, items: { $ref: '#/components/schemas/AdminPoiContentRevision' } }
    CuratedPoiSummary:
      type: object
      required: [name, categoryCode, categoryName]
      properties:
        name: { type: string }
        categoryCode: { type: string }
        categoryName: { type: string }
        description: { type: string, nullable: true }
        sourceSystem: { type: string, nullable: true }
        sourceRecordId: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        license: { type: string, nullable: true }
        attribution: { type: string, nullable: true }
    AdminPoiContentRevision:
      type: object
      required: [id, version, state, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        state: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    PublicPoiPhoto:
      type: object
      required: [id, path, altText, primary, displayOrder]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        altText: { type: string }
        primary: { type: boolean }
        displayOrder: { type: integer }
        author: { type: string, nullable: true }
        attribution: { type: string, nullable: true }
        license: { type: string, nullable: true }
    AdminMediaPublish:
      allOf:
        - $ref: '#/components/schemas/AdminMediaVersionedAction'
        - type: object
          required: [makePrimary]
          properties:
            makePrimary: { type: boolean }
    AdminMediaVersionedAction:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string }
    AdminValidationProblem:
      type: object
      required: [type, status, detail, code, errors]
      properties:
        type: { type: string, format: uri }
        status: { type: integer, enum: [400, 413] }
        detail: { type: string }
        code: { type: string, description: Stable machine-readable error code }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, description: Request field identifier }
              code: { type: string, description: Stable field validation code }
              message: { type: string, description: Safe corrective message }
    AdminMediaAsset:
      type: object
      required: [id, poiId, contentType, sha256, sizeBytes, width, height, author, sourceUrl, rightsStatus, state, primary, version]
      properties:
        id: { type: string, format: uuid }
        poiId: { type: string, format: uuid }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        sha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        author: { type: string }
        sourceUrl: { type: string }
        license: { type: string, nullable: true }
        attribution: { type: string, nullable: true }
        rightsEvidence: { type: string, nullable: true }
        rightsStatus: { type: string, enum: [UNVERIFIED, DOCUMENTED] }
        state: { type: string, enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, WITHDRAWN] }
        primary: { type: boolean }
        version: { type: integer, format: int64 }
    AdminGeographicDecision:
      type: object
      required: [expectedVersion, approve, reason]
      properties:
        expectedVersion: { type: integer, format: int64 }
        approve: { type: boolean }
        reason: { type: string }
    AdminIdentityDecision:
      allOf:
        - $ref: '#/components/schemas/AdminVersionedAction'
        - type: object
          required: [noDuplicate]
          properties:
            noDuplicate: { type: boolean }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
