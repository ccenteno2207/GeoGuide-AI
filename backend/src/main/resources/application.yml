spring:
  application:
    name: geoguide-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health

geoguide:
  routing:
    base-url: ${ROUTING_BASE_URL:http://graphhopper:8989}
    timeout: ${ROUTING_TIMEOUT:10s}
    profile: ${ROUTING_PROFILE:car}
