spring:
  application:
    name: geoguide-backend
  servlet:
    multipart:
      max-file-size: ${GEOGUIDE_MEDIA_MAX_BYTES:10MB}
      max-request-size: ${GEOGUIDE_MEDIA_MAX_BYTES:10MB}
      resolve-lazily: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health

geoguide:
  mincetur-import:
    enabled: ${GEOGUIDE_MINCETUR_IMPORT_ENABLED:false}
    source-path: ${GEOGUIDE_MINCETUR_SOURCE_PATH:}
    coordinate-manifest: ${GEOGUIDE_MINCETUR_COORDINATE_MANIFEST:classpath:data/destination-search/mincetur-20261110-coordinate-recovery-v1.json}
  admin:
    security:
      enabled: ${GEOGUIDE_ADMIN_SECURITY_ENABLED:false}
      roles-claim: ${GEOGUIDE_ADMIN_SECURITY_ROLES_CLAIM:roles}
      issuer-uri: ${GEOGUIDE_ADMIN_SECURITY_ISSUER_URI:}
      jwk-set-uri: ${GEOGUIDE_ADMIN_SECURITY_JWK_SET_URI:}
      audience: ${GEOGUIDE_ADMIN_SECURITY_AUDIENCE:}
  media:
    max-bytes: ${GEOGUIDE_MEDIA_MAX_BYTES:10485760}
    max-pixels: ${GEOGUIDE_MEDIA_MAX_PIXELS:40000000}
    storage:
      enabled: ${GEOGUIDE_MEDIA_STORAGE_ENABLED:false}
      endpoint: ${GEOGUIDE_MEDIA_STORAGE_ENDPOINT:}
      access-key: ${GEOGUIDE_MEDIA_STORAGE_ACCESS_KEY:}
      secret-key: ${GEOGUIDE_MEDIA_STORAGE_SECRET_KEY:}
      bucket: ${GEOGUIDE_MEDIA_STORAGE_BUCKET:geoguide-poi-media-private}
  routing:
    base-url: ${ROUTING_BASE_URL:http://graphhopper:8989}
    timeout: ${ROUTING_TIMEOUT:10s}
    profile: ${ROUTING_PROFILE:car}
