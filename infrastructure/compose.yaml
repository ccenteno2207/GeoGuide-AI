name: geoguide-ai

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoguide}
      POSTGRES_USER: ${POSTGRES_USER:-geoguide_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in infrastructure/.env}
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: geoguide-ai/backend:p2.7
    restart: unless-stopped
    user: "10001:10001"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geoguide}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geoguide_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in infrastructure/.env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in infrastructure/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in infrastructure/.env}
    # ports:
    #   - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    #   - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  graphhopper:
    build:
      context: ./routing/graphhopper
      args:
        GRAPHHOPPER_VERSION: ${GRAPHHOPPER_VERSION:-11.0}
        GRAPHHOPPER_SHA256: ${GRAPHHOPPER_SHA256:-b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def}
    image: geoguide-ai/graphhopper:${GRAPHHOPPER_VERSION:-11.0}
    restart: unless-stopped
    command:
      - -Xms${GRAPHHOPPER_XMS:-512m}
      - -Xmx${GRAPHHOPPER_XMX:-4g}
      - -jar
      - /opt/graphhopper/graphhopper-web.jar
      - server
      - /opt/graphhopper/config.yml
    mem_limit: ${GRAPHHOPPER_MEMORY_LIMIT:-5g}
    volumes:
      - type: bind
        source: ${ROUTING_PBF_PATH:-./routing/data/peru-geoguide-pilot.osm.pbf}
        target: /data/input.osm.pbf
        read_only: true
      - type: bind
        source: ${ROUTING_GRAPH_DIR:-./routing/data/graph-cache}
        target: /data/graph-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8989/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [data]

networks:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
