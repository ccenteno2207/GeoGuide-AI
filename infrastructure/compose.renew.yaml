name: geoguide-ai

services:
  certbot:
    image: geoguide-ai/certbot-dns-desec:4.0.0-1.3.2
    volumes:
      - letsencrypt:/etc/letsencrypt
    secrets:
      - source: desec_credentials
        target: desec.ini
        uid: "0"
        gid: "0"
        mode: 0400
    networks: [ingress]

networks:
  ingress:
    external: true
    name: geoguide-ai_ingress

volumes:
  letsencrypt:
    external: true
    name: geoguide-ai_letsencrypt

secrets:
  desec_credentials:
    file: ${DESEC_CREDENTIALS_FILE:-/dev/null}
